<div class="login-wrapper">
  <div class="login-card">
    <div class="login-header">
      <div class="logo-circle">📝</div>
      <h2>Sistema de Tarefas</h2>
      <p class="subtitle">Faça login para gerenciar suas tarefas</p>
    </div>

    <!-- Mensagens -->
    <div class="alert alert-success" *ngIf="mensagemSucesso()">
      {{ mensagemSucesso() }}
    </div>

    <div class="alert alert-error" *ngIf="mensagemErro()">
      {{ mensagemErro() }}
    </div>

    <form (ngSubmit)="fazerLogin()" class="login-form">
      <div class="form-group">
  <label for="login-nome">Nome da Usuária</label>
  <input
    type="text"
    id="login-nome"
    name="login-nome"
    [(ngModel)]="nome"
    placeholder="Ex: maria"
    autocomplete="username"
    required
  />
</div>

      <div class="form-group">
        <label for="login-senha">Senha</label>
        <input
          type="password"
          id="login-senha"
          name="login-senha"
          [(ngModel)]="senha"
          placeholder="Digite sua senha"
          autocomplete="current-password"
          required
        />
      </div>

      <button
        type="submit"
        class="btn btn-primary btn-block"
        [disabled]="carregando() || !nome || !senha"
      >
        {{ carregando() ? 'Entrando...' : 'Entrar' }}
      </button>
    </form>

    <p class="link-alternativo">Ainda não tem cadastro? <a routerLink="/cadastro">Cadastrar</a></p>
  </div>
</div>
